name: Test

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack dependencies
        run: tar -cf node_modules.tar node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules.tar
          retention-days: 1

  check:
    name: Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Unpack dependencies
        run: tar -xf node_modules.tar && rm node_modules.tar

      - name: Check
        run: bun run check

  install-react-native:
    name: Install React Native ${{ matrix.react_native }} fixtures
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react_native: &react_native_versions
          - 0.84.1
          - 0.85.3
          - 0.86.2
          - latest
          - next
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Unpack dependencies
        run: tar -xf node_modules.tar && rm node_modules.tar

      - name: Install fixtures
        env:
          REACT_NATIVE_VERSION: ${{ matrix.react_native }}
        run: bun scripts/prepareReactNativeFixtures.ts

      - name: Pack fixtures
        run: tar -cf fixtures.tar tests/react-native/fixtures

      - uses: actions/upload-artifact@v4
        with:
          name: react-native-fixtures-${{ matrix.react_native }}
          path: fixtures.tar
          retention-days: 1

  react-native:
    name: Bun ${{ matrix.bun.name }} / React Native ${{ matrix.react_native }}
    needs: install-react-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun:
          - name: 1.3.x
            version: "1.3.x"
          - name: 1.4.x
            version: "1.4.x"
          - name: latest
            version: latest
          - name: canary
            version: canary
        react_native: *react_native_versions
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: node_modules

      - uses: actions/download-artifact@v4
        with:
          name: react-native-fixtures-${{ matrix.react_native }}

      - name: Unpack dependencies
        run: |
          tar -xf node_modules.tar && rm node_modules.tar
          tar -xf fixtures.tar && rm fixtures.tar

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun.version }}

      - name: Test React Native suite
        run: bun run test:react-native

  expo:
    name: Bun ${{ matrix.bun.name }} / Expo ${{ matrix.expo }}
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun:
          - name: 1.3.x
            version: "1.3.x"
          - name: 1.4.x
            version: "1.4.x"
          - name: latest
            version: latest
          - name: canary
            version: canary
        expo:
          - latest
          - next
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Unpack dependencies
        run: tar -xf node_modules.tar && rm node_modules.tar

      - name: Set Expo fixture SDK
        env:
          EXPO_VERSION: ${{ matrix.expo }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const fixturesRoot = path.join("tests", "expo", "fixtures");
          for (const fixtureName of fs.readdirSync(fixturesRoot)) {
            const packageJsonPath = path.join(fixturesRoot, fixtureName, "package.json");
            if (!fs.existsSync(packageJsonPath)) continue;

            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
            if (!packageJson.dependencies?.expo) continue;

            packageJson.dependencies.expo = process.env.EXPO_VERSION;
            fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Install Expo fixture dependencies
        run: |
          for fixture in tests/expo/fixtures/*; do
            if [ ! -f "$fixture/package.json" ]; then
              continue
            fi

            has_expo=$(node -e 'const p=require("./'"$fixture"'/package.json"); process.stdout.write(p.dependencies?.expo ? "yes" : "no")')
            if [ "$has_expo" != "yes" ]; then
              continue
            fi

            (
              cd "$fixture"
              bun install --no-save
              packages=$(node -e 'const dependencies = require("./package.json").dependencies ?? {}; const names = Object.keys(dependencies).filter((name) => name !== "expo" && (name === "jest-expo" || name === "react" || name === "react-native" || name.startsWith("expo-") || name.startsWith("@expo/") || name.startsWith("react-native-"))); process.stdout.write(names.join(" "));')
              if [ -n "$packages" ]; then
                bunx expo install $packages
              fi
            )
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun.version }}

      - name: Test Expo suite
        run: bun run test:expo
