name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: React Native ${{ matrix.react_native }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react_native:
          - 0.84.1
          - 0.85.3
          - 0.86.2
          - latest
          - next
          - nightly
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install React Native peer dependency
        run: bun add --dev --exact react-native@${{ matrix.react_native }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test
