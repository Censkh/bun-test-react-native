name: Test

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  react-native:
    name: Bun ${{ matrix.bun.name }} / React Native ${{ matrix.react_native }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun:
          - name: 1.3.14
            version: 1.3.14
          - name: canary
            version: canary
        react_native:
          - 0.84.1
          - 0.85.3
          - 0.86.2
          - latest
          - next
          - nightly
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun.version }}

      - name: Install React Native peer dependency
        run: bun add --dev --exact react-native@${{ matrix.react_native }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test React Native suite
        run: bun run test:react-native

  expo:
    name: Bun ${{ matrix.bun.name }} / Expo ${{ matrix.expo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun:
          - name: 1.3.14
            version: 1.3.14
          - name: canary
            version: canary
        expo:
          - latest
          - next
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set Expo fixture SDK
        env:
          EXPO_VERSION: ${{ matrix.expo }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const fixturesRoot = path.join("tests", "expo", "fixtures");
          for (const fixtureName of fs.readdirSync(fixturesRoot)) {
            const packageJsonPath = path.join(fixturesRoot, fixtureName, "package.json");
            if (!fs.existsSync(packageJsonPath)) continue;

            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
            if (!packageJson.dependencies?.expo) continue;

            packageJson.dependencies.expo = process.env.EXPO_VERSION;
            fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          }
          NODE

      - name: Install Expo fixture dependencies
        run: |
          for fixture in tests/expo/fixtures/*; do
            if [ ! -f "$fixture/package.json" ]; then
              continue
            fi

            has_expo=$(node -e 'const p=require("./'"$fixture"'/package.json"); process.stdout.write(p.dependencies?.expo ? "yes" : "no")')
            if [ "$has_expo" != "yes" ]; then
              continue
            fi

            (
              cd "$fixture"
              bun install --no-save
              packages=$(node -e 'const dependencies = require("./package.json").dependencies ?? {}; const names = Object.keys(dependencies).filter((name) => name !== "expo" && (name === "jest-expo" || name === "react" || name === "react-native" || name.startsWith("expo-") || name.startsWith("@expo/") || name.startsWith("react-native-"))); process.stdout.write(names.join(" "));')
              if [ -n "$packages" ]; then
                bunx expo install $packages
              fi
            )
          done

      - name: Test Expo suite
        run: bun run test:expo
